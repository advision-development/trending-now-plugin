# Serve the same docroot on 8080 as well as 80.
#
# The site's home_url is http://localhost:8080, so WordPress loopback requests
# — which Action Scheduler's queue runner depends on — target port 8080 from
# inside the container. Without this the container would only be listening on
# 80 and every loopback would fail, which is not how a real host behaves.
Listen 8080

<VirtualHost *:8080>
	DocumentRoot /var/www/html
</VirtualHost>
